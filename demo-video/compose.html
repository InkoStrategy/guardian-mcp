<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pay-Safe compositor</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, S = 1.5; // css px -> canvas px
const TOP = 52;          // address bar height (canvas px) above page captures
const SUB_TOP = 925;     // subtitles live below this line
const C = { bg: '#0b0d10', card: '#13171c', line: '#232a33', txt: '#e6e9ee', muted: '#8d96a3', ok: '#3ecf8e', warn: '#f5b849', deny: '#f0574f', acc: '#6aa9ff' };
const MONO = 'Consolas, "Cascadia Mono", ui-monospace, monospace';
const SANS = 'system-ui, "Segoe UI", sans-serif';
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, x) => a + (b - a) * x;
const fadeWindow = (t, a, b, f) => clamp01((t - a) / f) * (1 - clamp01((t - b) / f));

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ---------- assets ----------
const bitmaps = new Map();
async function loadImage(name) {
  if (bitmaps.has(name)) return bitmaps.get(name);
  const p = fetch('/frames/' + name).then((r) => { if (!r.ok) throw new Error('missing frame ' + name); return r.blob(); }).then((b) => createImageBitmap(b));
  bitmaps.set(name, p);
  return p;
}
const ready = new Map();
function img(name) { return ready.get(name) || null; }
async function preload(names) { for (const n of names) { if (n && !ready.has(n)) ready.set(n, await loadImage(n)); } }
function release(names) { for (const n of names) { const b = ready.get(n); if (b && b.close) b.close(); ready.delete(n); bitmaps.delete(n); } }

// ---------- timeline ----------
function speechEnd(buf) {
  // WAVs from SAPI end with ~0.7 s of silence; pace sentences on the audible part
  const d = buf.getChannelData(0);
  let last = d.length - 1;
  while (last > 0 && Math.abs(d[last]) < 0.015) last--;
  return Math.min(buf.duration, last / buf.sampleRate + 0.12);
}

function buildTimeline(plan, buffers) {
  const LEAD = 0.45, GAP = 0.38, TAIL = 0.55;
  const MIN = { slide: 5, page: 8.4, scan: 16, terminal: 24 };
  let t = 0;
  const scenes = [];
  for (const sc of plan.scenes) {
    const vis = plan.visuals[sc.id];
    let cursor = LEAD;
    const sentences = sc.sentences.map((s, i) => {
      const buf = buffers[sc.id + '-' + i];
      const len = speechEnd(buf);
      const out = { display: s.display, buffer: buf, start: t + cursor, end: t + cursor + len };
      cursor += len + GAP;
      return out;
    });
    const isLast = sc === plan.scenes[plan.scenes.length - 1];
    const speech = cursor - GAP + (isLast ? 2.6 : TAIL);
    let duration = Math.max(MIN[vis.type], speech);
    if (vis.type === 'page' && vis.clickCue !== undefined) {
      const cueRel = sentences[vis.clickCue].start - t;
      duration = Math.max(duration, cueRel + 4.6);
    }
    scenes.push({ id: sc.id, vis, start: t, duration, sentences });
    t += duration;
  }
  return { scenes, total: t };
}

// ---------- shared drawing ----------
function drawAddressBar() {
  g.fillStyle = '#161b22'; g.fillRect(0, 0, W, TOP);
  g.fillStyle = C.line; g.fillRect(0, TOP - 1, W, 1);
  rr(300, 9, 1320, TOP - 18, (TOP - 18) / 2); g.fillStyle = '#0d1117'; g.fill();
  g.strokeStyle = C.muted; g.lineWidth = 2.2;
  g.beginPath(); g.arc(333, 22, 5.5, Math.PI, 0); g.stroke();
  rr(325, 22, 16, 12, 2); g.fillStyle = C.muted; g.fill();
  g.font = '500 21px ' + SANS; g.fillStyle = '#c9d1d9'; g.textBaseline = 'middle';
  g.fillText('guardian-mcp-rho.vercel.app', 356, TOP / 2 + 1);
  const w = g.measureText('guardian-mcp-rho.vercel.app').width;
  g.fillStyle = C.muted; g.fillText('/pay-safe', 356 + w, TOP / 2 + 1);
  g.textBaseline = 'alphabetic';
}

function drawCrop(name, scrollCss, alpha) {
  const b = img(name);
  if (!b) return;
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  const hh = H - TOP;
  const sy = Math.max(0, Math.min(b.height - hh, scrollCss * S));
  g.drawImage(b, 0, sy, W, hh, 0, TOP, W, hh);
  g.globalAlpha = 1;
}
const cy = (yCss, scroll) => TOP + (yCss - scroll) * S;

function maskScan(plan, imageName, scroll, alpha) {
  const top = plan.meta.imageScanTop[imageName];
  if (top === undefined || alpha <= 0) return;
  const y = Math.max(TOP, cy(top - 18, scroll));
  if (y >= H) return;
  g.globalAlpha = alpha; g.fillStyle = C.bg; g.fillRect(0, y, W, H - y); g.globalAlpha = 1;
}

function drawCursor(x, y, press) {
  g.save();
  g.translate(x, y);
  if (press > 0 && press < 1) {
    g.beginPath(); g.arc(0, 0, 18 + press * 46, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(106,169,255,' + (0.85 * (1 - press)) + ')'; g.lineWidth = 5; g.stroke();
  }
  g.scale(1.55, 1.55);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(6, 17); g.lineTo(10, 26); g.lineTo(14, 24); g.lineTo(10, 15); g.lineTo(17, 15); g.closePath();
  g.fillStyle = '#ffffff'; g.fill(); g.strokeStyle = '#111'; g.lineWidth = 1.4; g.stroke();
  g.restore();
}

function card(x, y, w, h, border, alpha) {
  g.save();
  g.globalAlpha = alpha;
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 40;
  rr(x, y, w, h, 18); g.fillStyle = '#10151b'; g.fill();
  g.shadowBlur = 0; g.lineWidth = 3; g.strokeStyle = border; g.stroke();
  g.restore();
}

// ---------- page scenes (demo sellers) ----------
function scenarioPlan(sc, plan) {
  const st = plan.meta.states[sc.vis.key];
  const btn = plan.meta.buttons.find((b) => b.title === sc.vis.button);
  const visibleCss = (SUB_TOP - 12 - TOP) / S;
  const resultBottom = st.resultBox.y + st.resultBox.h;
  const labelTop = plan.meta.feeLabel ? plan.meta.feeLabel.y - 16 : st.resultBox.y - 120;
  return { st, btnCenter: { x: btn.x + btn.w / 2, y: btn.y + btn.h * 0.42 }, yBtn: 170, yRes: Math.max(0, Math.max(resultBottom - visibleCss, labelTop)) };
}

function pageOffset(sc) {
  const v = sc.vis;
  if (v.clickCue === undefined) return 0;
  return Math.max(0, sc.sentences[v.clickCue].start - sc.start - 2.8);
}

function drawPage(sc, lt, plan) {
  const p = sc._p || (sc._p = scenarioPlan(sc, plan));
  const off = pageOffset(sc);
  const enter = sc._enter;
  const t1 = lt - off;
  let scroll;
  if (t1 < 0) scroll = enter.scroll;
  else if (t1 < 0.9) scroll = lerp(enter.scroll, p.yBtn, ease(t1 / 0.9));
  else if (t1 < 3.0) scroll = p.yBtn;
  else scroll = lerp(p.yBtn, p.yRes, ease((t1 - 3.0) / 1.2));

  const key = sc.vis.key;
  const hover = 'page-' + key + '-hover.jpg', loading = 'page-' + key + '-loading.jpg', result = 'page-' + key + '-result.jpg';
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  let shown;
  if (t1 < 1.15) { drawCrop(enter.image, scroll); shown = enter.image; }
  else if (t1 < 1.6) { drawCrop(hover, scroll); shown = hover; }
  else if (t1 < 2.6) { drawCrop(loading, scroll); shown = loading; }
  else {
    const a = clamp01((t1 - 2.6) / 0.25);
    drawCrop(loading, scroll); drawCrop(result, scroll, a);
    shown = a < 1 ? (plan.meta.imageScanTop[loading] < plan.meta.imageScanTop[result] ? loading : result) : result;
  }
  maskScan(plan, shown, scroll, 1);

  const from = enter.cursor || { x: 1180, y: p.yBtn + 560 };
  const mv = ease(clamp01((t1 - 0.2) / 1.0));
  const cx = lerp(from.x, p.btnCenter.x, mv), cyy = lerp(from.y, p.btnCenter.y, mv);
  const press = t1 >= 1.6 && t1 < 2.0 ? (t1 - 1.6) / 0.4 : 0;
  if (cy(cyy, scroll) > TOP) drawCursor(cx * S, cy(cyy, scroll), press);

  if (sc.vis.leadHighlights) drawLeadHighlights(sc, lt, off, scroll, plan);
  if (sc.vis.payeeCard) drawPayeeCard(sc, lt, plan);
  if (sc.vis.domainCallout) drawDomainCallout(sc, lt, scroll, p, plan);
  drawAddressBar();
}

function glowBox(x, y, w, h, color, a, r) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; rr(x, y, w, h, r || 12); g.strokeStyle = color; g.lineWidth = 4; g.shadowColor = color; g.shadowBlur = 20; g.stroke(); g.restore();
}

function drawLeadHighlights(sc, lt, off, scroll, plan) {
  const hl = sc.vis.leadHighlights;
  const phrases = plan.meta.leadPhrases || [];
  const s = sc.sentences[Math.min(hl.cue, sc.sentences.length - 1)];
  const sStart = s.start - sc.start, sDur = s.end - s.start;
  const endA = 1 - clamp01((lt - (off + 0.1)) / 0.4);
  phrases.forEach((ph, i) => {
    const at = sStart + sDur * (hl.fractions[i] || 0) - 0.15;
    const a = clamp01((lt - at) / 0.3) * endA;
    for (const r of ph.rects) glowBox((r.x - 5) * S, cy(r.y - 3, scroll), (r.w + 10) * S, (r.h + 6) * S, C.acc, a, 10);
  });
}

function drawDomainCallout(sc, lt, scroll, p, plan) {
  const rows = p.st.rows || [];
  const row = rows.find((r) => r.code === 'eip712_domain_mismatch');
  if (!row) return;
  const s0 = sc.sentences[0];
  const boxAt = Math.max(4.3, s0.start - sc.start + 1.2);
  const cardAt = Math.max(4.8, s0.start - sc.start + (s0.end - s0.start) * 0.5);
  const fadeOut = clamp01((sc.duration - lt) / 0.3);
  glowBox((row.x - 8) * S, cy(row.y - 2, scroll), (row.w + 16) * S, (row.h + 4) * S, C.warn, clamp01((lt - boxAt) / 0.3) * fadeOut, 12);
  const a = clamp01((lt - cardAt) / 0.35) * fadeOut;
  if (a <= 0) return;
  const rowBottom = cy(row.y + row.h, scroll);
  const h = 170, w = 1350, x = (W - w) / 2;
  const y = Math.min(rowBottom + 24, SUB_TOP - 20 - h);
  g.save(); g.globalAlpha = 0.9 * a; g.fillStyle = C.bg; g.fillRect(x - 20, y - 16, w + 40, h + 32); g.restore();
  card(x, y, w, h, C.warn, a);
  g.save(); g.globalAlpha = a;
  g.font = '600 24px ' + SANS; g.fillStyle = C.muted;
  g.fillText('the challenge declares', x + 50, y + 58);
  g.fillText('USD₮0 on X Layer signs as', x + 720, y + 58);
  g.font = '46px ' + MONO;
  g.fillStyle = C.deny; g.fillText('"USDT" v1', x + 50, y + 128);
  g.fillStyle = C.ok; g.fillText('"USD₮0" v1', x + 720, y + 128);
  g.restore();
}

function drawPayeeCard(sc, lt, plan) {
  const cue = sc.sentences[Math.min(sc.vis.payeeCard.cue, sc.sentences.length - 1)].start - sc.start - 0.25;
  const a = clamp01((lt - cue) / 0.35) * clamp01((sc.duration - lt) / 0.3);
  if (a <= 0) return;
  const expected = plan.payee.expected, payTo = plan.payee.payTo;
  const x = 205, y = 495, w = 1510, h = 300;
  g.save(); g.globalAlpha = 0.9 * a; g.fillStyle = C.bg; g.fillRect(x - 24, y - 20, w + 48, h + 40); g.restore();
  card(x, y, w, h, C.deny, a);
  g.save(); g.globalAlpha = a;
  g.font = '600 26px ' + SANS; g.fillStyle = C.muted;
  g.fillText('Same start, same end, different middle', x + 40, y + 56);
  g.font = '44px ' + MONO;
  const cw = g.measureText('M').width;
  const rows = [['expected', expected, C.txt], ['payTo', payTo, C.deny]];
  rows.forEach((row, i) => {
    const label = row[0], addr = row[1], midColor = row[2];
    const ly = y + 140 + i * 90;
    g.font = '600 24px ' + SANS; g.fillStyle = C.muted; g.fillText(label, x + 40, ly - 4);
    g.font = '44px ' + MONO;
    const ax = x + 250;
    for (let k = 0; k < addr.length; k++) {
      const edge = k < 6 || k >= addr.length - 4;
      g.fillStyle = edge ? C.ok : midColor;
      g.fillText(addr[k], ax + k * cw, ly);
    }
  });
  g.restore();
}

// ---------- scan scene ----------
function drawScan(sc, lt, plan) {
  const st = plan.meta.scan;
  const D = sc.duration;
  const enter = sc._enter;
  const cues = plan.scanCues;
  const at = (i) => sc.sentences[Math.min(i, sc.sentences.length - 1)].start - sc.start;
  const tKpi = at(cues.kpi) - 0.2;
  const tDeny = at(cues.deny) - 0.35;
  const tWarn = at(cues.warn) - 0.3;
  const tAdv = at(cues.advisory) - 0.3;
  const yLead = Math.max(0, st.scanLead.y - 80);
  const yF = Math.max(0, st.scanFindings.y - 60);
  let scroll;
  if (lt < 1.6) scroll = lerp(enter.scroll, yLead, ease(lt / 1.6));
  else if (lt < tDeny - 1.2) scroll = yLead;
  else if (lt < tDeny) scroll = lerp(yLead, yF, ease((lt - (tDeny - 1.2)) / 1.2));
  else scroll = yF;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  drawCrop('page-scan.jpg', scroll);
  maskScan(plan, 'page-scan.jpg', scroll, 1 - clamp01(lt / 0.6));

  const box = (bx, by, bw, bh, color, a) => {
    if (a <= 0) return;
    g.save(); g.globalAlpha = a; rr((bx - 8) * S, cy(by - 8, scroll), (bw + 16) * S, (bh + 16) * S, 16); g.strokeStyle = color; g.lineWidth = 5; g.shadowColor = color; g.shadowBlur = 24; g.stroke(); g.restore();
  };
  box(st.scanKpi.x, st.scanKpi.y, st.scanKpi.w, st.scanKpi.h, C.acc, fadeWindow(lt, tKpi, tDeny - 1.2, 0.4));
  box(st.scanFindings.x, st.scanFindings.y, st.scanFindings.w, st.denyRowsHeight, C.deny, fadeWindow(lt, tDeny, tWarn, 0.4));

  const dim = clamp01((lt - tWarn) / 0.4);
  if (dim > 0) { g.globalAlpha = 0.72 * dim; g.fillStyle = C.bg; g.fillRect(0, TOP, W, H - TOP); g.globalAlpha = 1; }
  drawEip712Card(plan, fadeWindow(lt, tWarn, tAdv - 0.45, 0.4));
  drawAdvisoryCard(plan, clamp01((lt - tAdv + 0.05) / 0.4) * clamp01((D - lt) / 0.4));
  drawAddressBar();
}

function drawEip712Card(plan, a) {
  if (a <= 0) return;
  const rows = plan.scanCards.eip712;
  const x = 230, y = 110, w = 1460, h = 170 + rows.length * 88 + 70;
  card(x, y, w, h, C.warn, a);
  g.save(); g.globalAlpha = a;
  g.font = '600 24px ' + SANS; g.fillStyle = C.warn; g.fillText('WARN  eip712_domain_mismatch  ·  live OKX.AI sellers', x + 44, y + 58);
  g.font = '600 38px ' + SANS; g.fillStyle = C.txt; g.fillText('The EIP-712 domain each challenge declares', x + 44, y + 118);
  rows.forEach((r, i) => {
    const ly = y + 200 + i * 88;
    g.font = '32px ' + SANS; g.fillStyle = C.txt; g.fillText(r.service, x + 44, ly);
    g.font = '24px ' + SANS; g.fillStyle = C.muted; g.fillText('sid ' + r.sid, x + 44, ly + 34);
    g.font = '36px ' + MONO; g.fillStyle = C.deny; g.fillText('"' + r.name + '" v' + r.version, x + 960, ly + 6);
  });
  const fy = y + 200 + rows.length * 88 + 8;
  g.font = '600 28px ' + SANS; g.fillStyle = C.ok;
  g.fillText('USD₮0 on X Layer signs only as "USD₮0" v1', x + 44, fy);
  g.restore();
}

function drawAdvisoryCard(plan, a) {
  if (a <= 0) return;
  const adv = plan.scanCards.advisory;
  const x = 330, y = 250, w = 1260, h = 440;
  card(x, y, w, h, C.muted, a);
  g.save(); g.globalAlpha = a;
  const total = Object.keys(adv).reduce((s, k) => s + adv[k], 0);
  g.font = '600 38px ' + SANS; g.fillStyle = C.txt; g.fillText('The other ' + total + ' WARNs are advisory', x + 44, y + 80);
  const rows = [
    [adv.fresh_recipient || 0, 'fresh_recipient', 'payee wallet with no history yet'],
    [adv.endpoint_domain_suspicious || 0, 'endpoint_domain_suspicious', 'hostname that looks like OKX'],
  ];
  rows.forEach((row, i) => {
    const ly = y + 190 + i * 130;
    g.font = '700 72px ' + SANS; g.fillStyle = C.warn; g.fillText(String(row[0]), x + 50, ly + 20);
    g.font = '30px ' + MONO; g.fillStyle = C.txt; g.fillText(row[1], x + 170, ly - 10);
    g.font = '28px ' + SANS; g.fillStyle = C.muted; g.fillText(row[2], x + 170, ly + 32);
  });
  g.restore();
}

// ---------- terminal scene ----------
function wrapChars(text, max, indent) {
  const pad = ' '.repeat(indent || 4);
  const out = [];
  let rest = text;
  while (rest.length > max) {
    let cut = rest.lastIndexOf(' ', max);
    if (cut < max * 0.6) cut = max;
    out.push(rest.slice(0, cut));
    rest = pad + rest.slice(cut).replace(/^\s+/, '');
  }
  out.push(rest);
  return out;
}

const TOKEN = /(DENY|WARN|ALLOW|exit 3|exit 2|exit 0|MISMATCH|matches the checked payee, amount and token|nothing signed|via onchainos [a-z]+ [a-z-]+|insufficient \(short [0-9.]+\)|not requested)/g;
function colorOf(tok) {
  if (tok === 'DENY' || tok === 'exit 3' || tok === 'MISMATCH') return C.deny;
  if (tok === 'WARN' || tok === 'exit 2') return C.warn;
  if (tok === 'nothing signed' || tok.indexOf('via onchainos') === 0) return C.acc;
  if (tok === 'not requested' || tok.indexOf('insufficient') === 0) return C.warn;
  return C.ok;
}

function drawTerminal(sc, lt, plan) {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const x = 90, y = 40, w = 1740, h = 850;
  rr(x, y, w, h, 18); g.fillStyle = '#0d1117'; g.fill(); g.strokeStyle = C.line; g.lineWidth = 2; g.stroke();
  g.save(); rr(x, y, w, 52, 18); g.clip(); g.fillStyle = '#161b22'; g.fillRect(x, y, w, 52); g.restore();
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { g.beginPath(); g.arc(x + 30 + i * 26, y + 26, 8, 0, Math.PI * 2); g.fillStyle = c; g.fill(); });
  g.fillStyle = C.muted; g.font = '500 22px ' + SANS; g.textAlign = 'center';
  g.fillText('Onchain OS buyer · test agent #13761 · node scripts/safe-pay.js', x + w / 2, y + 34); g.textAlign = 'left';

  const blocks = plan.terminal;
  const cues = plan.terminalCues;
  const starts = blocks.map((b, i) => (i === 0 ? 0 : Math.max(0, sc.sentences[Math.min(cues[i], sc.sentences.length - 1)].start - sc.start - 0.3)));
  let bi = 0;
  for (let i = 0; i < blocks.length; i++) if (lt >= starts[i]) bi = i;
  const b = blocks[bi];
  const t = lt - starts[bi];
  g.font = '25px ' + MONO;
  const cw = g.measureText('M').width;
  const maxChars = Math.floor((w - 80) / cw);
  const lineH = 37;
  const lines = [];
  const cps = Math.max(70, b.cmd.length / 1.0);
  const typed = Math.min(b.cmd.length, Math.max(0, Math.floor((t - 0.2) * cps)));
  wrapChars('$ ' + b.cmd.slice(0, typed), maxChars, 4).forEach((l, i) => lines.push({ text: l, prompt: i === 0 }));
  const typedDone = 0.2 + b.cmd.length / cps;
  if (typed >= b.cmd.length) {
    const outT = t - typedDone - 0.45;
    const wrapped = [];
    b.lines.forEach((l) => wrapChars(l, maxChars, 13).forEach((q) => wrapped.push(q)));
    const shown = outT < 0 ? 0 : Math.min(wrapped.length, Math.floor(outT / 0.07) + 1);
    for (let i = 0; i < shown; i++) lines.push({ text: wrapped[i] });
    if (shown >= wrapped.length && Math.floor(lt * 2) % 2 === 0) lines.push({ text: '$ ', cursor: true });
  } else if (Math.floor(lt * 3) % 2 === 0) {
    lines[lines.length - 1].caret = true;
  }
  const maxLines = Math.floor((h - 110) / lineH);
  const visible = lines.slice(Math.max(0, lines.length - maxLines));
  if (bi === blocks.length - 1 && sc.sentences.length > 5) {
    const payAt = sc.sentences[5].start - sc.start - 0.2;
    const k = visible.findIndex((ln) => ln.text.indexOf('onchainos payment pay --payment-id') >= 0);
    if (k >= 0) { const ly = y + 102 + k * lineH; glowBox(x + 24, ly - 30, w - 48, lineH + 8, C.acc, clamp01((lt - payAt) / 0.3), 10); }
  }
  visible.forEach((ln, i) => {
    const ly = y + 102 + i * lineH;
    let lx = x + 38;
    let text = ln.text;
    if (text.startsWith('$ ')) { g.font = '25px ' + MONO; g.fillStyle = C.acc; g.fillText('$', lx, ly); lx += cw * 2; text = text.slice(2); }
    let last = 0;
    text.replace(TOKEN, (m, _t, idx) => {
      g.font = '25px ' + MONO; g.fillStyle = '#c9d1d9'; g.fillText(text.slice(last, idx), lx + last * cw, ly);
      g.font = 'bold 25px ' + MONO; g.fillStyle = colorOf(m); g.fillText(m, lx + idx * cw, ly);
      last = idx + m.length; return m;
    });
    g.font = '25px ' + MONO; g.fillStyle = '#c9d1d9'; g.fillText(text.slice(last), lx + last * cw, ly);
    if (ln.caret || ln.cursor) { g.fillStyle = C.txt; g.fillRect(lx + text.length * cw + 2, ly - 22, cw * 0.6, 28); }
  });
  g.font = '600 21px ' + SANS; g.fillStyle = C.muted;
  g.fillText('run ' + (bi + 1) + ' of ' + blocks.length + ' · ' + b.label, x + 38, y + h - 22);
}

// ---------- slides and subtitles ----------
function drawSlide(sc, lt) {
  const b = img(sc.vis.img);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (!b) return;
  const k = 1 + 0.018 * clamp01(lt / sc.duration);
  g.save(); g.translate(W / 2, H / 2); g.scale(k, k); g.drawImage(b, -W / 2, -H / 2, W, H); g.restore();
}

function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (g.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = wd; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawSubtitle(sc, t) {
  let active = null;
  for (let i = 0; i < sc.sentences.length; i++) {
    const s = sc.sentences[i];
    const next = sc.sentences[i + 1];
    const until = next ? next.start - 0.02 : s.end + 0.35;
    if (t >= s.start - 0.08 && t < until) active = s;
  }
  if (!active) return;
  g.font = '600 38px ' + SANS;
  const lines = wrapText(active.display, 1580);
  const lh = 50;
  const boxH = lines.length * lh + 26;
  const widest = Math.max.apply(null, lines.map((l) => g.measureText(l).width));
  const bx = W / 2 - widest / 2 - 28, by = H - 34 - boxH;
  rr(bx, by, widest + 56, boxH, 14); g.fillStyle = 'rgba(6,8,12,0.93)'; g.fill();
  g.fillStyle = '#ffffff'; g.textAlign = 'center';
  lines.forEach((l, i) => g.fillText(l, W / 2, by + 13 + lh * (i + 1) - 13));
  g.textAlign = 'left';
}

function fadeFor(sc, lt, prev, next) {
  const cont = (a, b) => a && b && (a.vis.type === 'page' || a.vis.type === 'scan') && (b.vis.type === 'page' || b.vis.type === 'scan');
  let a = 1;
  if (!cont(prev, sc)) a = Math.min(a, clamp01(lt / 0.35));
  if (!cont(sc, next)) a = Math.min(a, clamp01((sc.duration - lt) / 0.35));
  return a;
}

function imagesFor(sc) {
  const v = sc.vis;
  if (v.type === 'slide') return [v.img];
  if (v.type === 'page') return ['page-' + v.key + '-hover.jpg', 'page-' + v.key + '-loading.jpg', 'page-' + v.key + '-result.jpg', sc._enter && sc._enter.image];
  if (v.type === 'scan') return ['page-scan.jpg'];
  return [];
}

async function loadAll(plan, ac) {
  const buffers = {};
  for (const sc of plan.scenes) {
    for (let i = 0; i < sc.sentences.length; i++) {
      const ab = await (await fetch('/audio/' + sc.id + '-' + i + '.wav')).arrayBuffer();
      buffers[sc.id + '-' + i] = await ac.decodeAudioData(ab);
    }
  }
  const tl = buildTimeline(plan, buffers);
  let carry = { scroll: 0, cursor: null, image: 'page-base.jpg' };
  for (const sc of tl.scenes) {
    sc._enter = carry;
    if (sc.vis.type === 'page') { const p = scenarioPlan(sc, plan); carry = { scroll: p.yRes, cursor: p.btnCenter, image: 'page-' + sc.vis.key + '-result.jpg' }; }
    if (sc.vis.type === 'scan') carry = { scroll: 0, cursor: null, image: 'page-scan.jpg' };
  }
  return tl;
}

window.getTimeline = async function () {
  const plan = await (await fetch('/plan.json')).json();
  const tl = await loadAll(plan, new OfflineAudioContext(1, 48000, 48000));
  return { total: tl.total, scenes: tl.scenes.map((s) => ({ id: s.id, type: s.vis.type, start: s.start, duration: s.duration, sentences: s.sentences.map((x) => ({ start: x.start, end: x.end, display: x.display })) })) };
};

// ---------- main ----------
window.renderVideo = async function (opts) {
  const plan = await (await fetch('/plan.json')).json();
  const ac = new AudioContext({ sampleRate: 48000 });
  const tl = await loadAll(plan, ac);
  const from = opts && opts.from ? tl.scenes.findIndex((s) => s.id === opts.from) : 0;
  const toIdx = opts && opts.to ? tl.scenes.findIndex((s) => s.id === opts.to) : tl.scenes.length - 1;
  const scenes = tl.scenes.slice(from, toIdx + 1);
  const t0 = scenes[0].start;
  const total = scenes[scenes.length - 1].start + scenes[scenes.length - 1].duration - t0;

  await preload(imagesFor(scenes[0]));

  const dest = ac.createMediaStreamDestination();
  const vtrack = cv.captureStream(30).getVideoTracks()[0];
  const stream = new MediaStream([vtrack].concat(dest.stream.getAudioTracks()));
  const mime = (opts && opts.mime) || 'video/webm;codecs=vp9,opus';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: (opts && opts.bitrate) || 9000000, audioBitsPerSecond: 160000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise((r) => { rec.onstop = r; });

  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  rec.start(1000);
  const PRE = 0.4;
  const base = ac.currentTime + PRE;
  for (const sc of scenes) for (const s of sc.sentences) {
    const src = ac.createBufferSource();
    src.buffer = s.buffer;
    src.connect(dest);
    src.start(base + (s.start - t0));
  }

  let frames = 0, slowFrames = 0, lastWall = performance.now();
  const entered = new Set();
  await new Promise((resolve) => {
    function frame() {
      const now = performance.now();
      if (now - lastWall > 60) slowFrames++;
      lastWall = now;
      const t = ac.currentTime - base + t0;
      if (ac.currentTime - base > total + 0.35) return resolve();
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      const idx = tl.scenes.findIndex((s) => t >= s.start && t < s.start + s.duration);
      if (idx >= 0) {
        const sc = tl.scenes[idx];
        const lt = t - sc.start;
        if (!entered.has(sc.id)) {
          entered.add(sc.id);
          const nxt = tl.scenes[idx + 1];
          const keep = new Set(imagesFor(sc).concat(nxt ? imagesFor(nxt) : []));
          for (const n of Array.from(ready.keys())) if (!keep.has(n)) release([n]);
          preload(imagesFor(sc));
          if (nxt) preload(imagesFor(nxt));
        }
        if (sc.vis.type === 'slide') drawSlide(sc, lt);
        else if (sc.vis.type === 'page') drawPage(sc, lt, plan);
        else if (sc.vis.type === 'scan') drawScan(sc, lt, plan);
        else if (sc.vis.type === 'terminal') drawTerminal(sc, lt, plan);
        const a = fadeFor(sc, lt, tl.scenes[idx - 1], tl.scenes[idx + 1]);
        if (a < 1) { g.fillStyle = 'rgba(0,0,0,' + (1 - a) + ')'; g.fillRect(0, 0, W, H); }
        if (sc.vis.type === 'page' || sc.vis.type === 'scan') {
          const grad = g.createLinearGradient(0, 870, 0, 930);
          grad.addColorStop(0, 'rgba(11,13,16,0)'); grad.addColorStop(1, 'rgba(11,13,16,0.96)');
          g.fillStyle = grad; g.fillRect(0, 870, W, 60); g.fillStyle = 'rgba(11,13,16,0.96)'; g.fillRect(0, 930, W, H - 930);
        }
        drawSubtitle(sc, t);
      }
      frames++;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  rec.stop();
  await stopped;
  const blob = new Blob(chunks, { type: 'video/webm' });
  const name = (opts && opts.out) || 'render.webm';
  await fetch('/save/' + name, { method: 'POST', body: blob });
  return { name, bytes: blob.size, seconds: total + PRE + 0.35, frames, slowFrames, mime, scenes: tl.scenes.map((s) => ({ id: s.id, start: +s.start.toFixed(2), duration: +s.duration.toFixed(2), sentences: s.sentences.length })) };
};
</script>
