<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{background:#0b0d10;display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;position:relative}
.glow{position:absolute;inset:0;
  background:radial-gradient(circle at 50% 38%, rgba(62,207,142,.16), transparent 58%)}
.grid{position:absolute;inset:0;opacity:.55;
  background-image:linear-gradient(#171c22 1px,transparent 1px),linear-gradient(90deg,#171c22 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 32%, transparent 76%)}
.wrap{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
svg{display:block}
.code{font-size:76px;font-weight:700;fill:#3ecf8e;letter-spacing:1px}
.name{margin-top:52px;font-size:104px;font-weight:700;color:#e6e9ee;letter-spacing:10px}
.sub{margin-top:20px;font-size:38px;font-weight:600;color:#3ecf8e;letter-spacing:2px}
.foot{margin-top:14px;font-size:27px;color:#7d8794;letter-spacing:1.5px}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <svg width="392" height="432" viewBox="0 0 215 237">
    <path d="M107.5 6 L201 40 V120 C201 173 160 209 107.5 231 C55 209 14 173 14 120 V40 Z"
          fill="rgba(62,207,142,.07)" stroke="#3ecf8e" stroke-width="6" stroke-linejoin="round"/>
    <text class="code" x="107.5" y="135" text-anchor="middle">402</text>
  </svg>
  <div class="name">LNO ALPHA</div>
  <div class="sub">GuardianMCP&nbsp;&nbsp;Pay-Safe</div>
  <div class="foot">OKX DEV DAY 2026</div>
</div>
</body></html>
